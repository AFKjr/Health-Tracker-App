<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFK Blood Pressure and Exercise Journal</title>
    <link rel="stylesheet" href="styles.css">
</head>
    <body>
        <h1 class="main-heading">Welcome to the AFK Blood Pressure and Exercise Journal!</h1>
        
        <h2 class="sub-heading">The Easy to Use Tracker for Monitoring Your Blood Pressure, Weight and Exercise Routine</h2>
        
        <h3 class="measurement-header">Please enter your measurements</h3>
        
        <div class="form-container">
            <label for="date-entry">Date:</label>
            <input type="date" id="date-entry" name="entry-date">

            <label for="feet">Height:</label>
            <input type="number" id="feet" name="feet" placeholder="5"> feet
            <input type="number" id="inches" name="inches" placeholder="10"> inches
        
            <label for="weight">Weight</label>
            <input type="number" id="weight" name="weight"> Lbs

            <label for="blood-pressure">BP</label>
            <input type="text" id="blood-pressure" name="blood-pressure" placeholder="120/80"> mmHg
        </div>

        <h3 class="exercise-header">Lets Add Your Workout</h3>

        <div class="exercise-container">
            <select id="exercise-name" name="exercise-name">
                <option value="">-- Select Exercise --</option>
                <option value="sit-ups">Sit-ups</option>
                <option value="push-ups">Push-ups</option>
                <option value="squats">Squats</option>
                <option value="running">Running</option>
                <option value="outdoor-walk">Outdoor Walk</option>
                <option value="cycling">Indoor Bike Ride</option>
                <option value="other">Other</option>
            </select>
            <input type="text" id="custom-exercise" placeholder="Enter exercise name" style="display: none;">
            <input type="number" id="exercise-reps" name="exercise-reps" placeholder="50"> 
            <input type="number" id="exercise-time" name="exercise-time" placeholder="30" style="display: none;"> 
            
            
            <button type="button" id="add-exercise-button">Add Exercise</button>
        </div>

        <button type="submit">submit</button>

        <div id="weight-display" style="display: none">
            <h3>Your recorded weight:</h3>
            <p id="weight-result"</p>
        </div>
        <div id="bmi-display" style="display: none;">
            <h3>Your BMI:</h3>
            <p id="bmi-result"></p>
        </div>
        <div id="blood-pressure-display" style="display: none">
            <h3>Your recorded blood pressure:</h3>
            <p id="blood-pressure-result"></p>
        </div>

        <script src="script.js"></script>
    </body>
</html>
