<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000080">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AFK Tracker">
    <title>AFK Health Tracker - Logs</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="logs.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.svg">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.1.0"></script>
</head>
<body>
    <nav class="nav-bar">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="logs.html">View Logs</a></li>
        </ul>
    </nav>

    <h1 class="main-heading">Your Health Logs</h1>

    <div id="controls">
        <div class="controls-group">
            <label for="date-filter">Show:</label>
            <select id="date-filter">
                <option value="all">All Time</option>
                <option value="7">Last 7 Days</option>
                <option value="30">Last 30 Days</option>
                <option value="90">Last 90 Days</option>
            </select>
        </div>
        <div class="controls-group">
            <button id="export-csv-btn">Export CSV</button>
            <label for="import-csv" class="file-label">Import CSV</label>
            <input type="file" id="import-csv" accept=".csv" style="display:none;">
            <button id="export-json-btn">Backup Data</button>
            <label for="import-file" class="file-label">Restore Backup</label>
            <input type="file" id="import-file" accept=".json" style="display:none;">
        </div>
    </div>

    <h2>Weight Trend</h2>
    <div class="chart-container">
        <canvas id="weight-chart"></canvas>
    </div>

    <h2>Blood Pressure Trend</h2>
    <div class="chart-container">
        <canvas id="bp-chart"></canvas>
    </div>

    <h2>BMI Trend</h2>
    <div class="chart-container">
        <canvas id="bmi-chart"></canvas>
    </div>

    <h2>Your Entries</h2>
    <div id="logs-container">
        <!-- Logs will be displayed here by javascript-->
    </div>

    <div id="toast" class="toast" aria-live="polite"></div>
    <script type="module" src="js/logs-page.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
