<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFK Health Tracker - Logs</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="logs.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3"></script>
</head>
<body>
    <nav class="nav-bar">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="logs.html">View Logs</a></li>
        </ul>
    </nav>

    <h1 class="main-heading">Your Health Logs</h1>
    <h2>Weight Trend</h2>
    <div class="chart-container">
        <canvas id="weight-chart"></canvas>
    </div>

    <h2>Blood Pressure Trend</h2>
    <div class="chart-container">
        <canvas id="bp-chart"></canvas>
    </div>

    <h2>BMI Trend</h2>
    <div class="chart-container">
        <canvas id="bmi-chart"></canvas>
    </div>

    <h2>Your Entries</h2>
    <div id="logs-container">
        <!-- Logs will be displayed here by javascript-->
    </div>

    <div id="toast" class="toast"></div>
    <script src="logs.js"></script>
    
</body>
</html>
